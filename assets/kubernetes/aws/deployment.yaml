apiVersion: apps/v1
kind: Deployment
metadata:
  name: &app-name py-inventory-a2a-v2
  namespace: test-a
  labels:
    app: *app-name
spec:
  replicas: 1
  strategy:
    type: RollingUpdate
  selector:
    matchLabels:
      app: *app-name
  template:
    metadata:
      labels:
        app: *app-name
    spec:
      serviceAccountName: sa-py-inventory-a2a-v2
      enableServiceLinks: false
      volumes:
      securityContext:
        runAsUser: 1000
        runAsGroup: 2000
        fsGroup: 3000
      containers:
      - name: *app-name
        image: 908671954593.dkr.ecr.us-east-2.amazonaws.com/py-inventory-a2a-v2:latest
        envFrom:
        - configMapRef:
            name: cm-py-inventory-a2a-v2
        resources:
           requests:
             cpu: 100m
             memory: 100Mi
           limits:
             cpu: 400m
             memory: 200Mi
        securityContext:
          seccompProfile:
            type: RuntimeDefault
          runAsNonRoot: true
          runAsUser: 1100
          allowPrivilegeEscalation: true
          capabilities:
            drop:
            - ALL
        ports:
        - name: http
          containerPort: 7601
          protocol: TCP
        - name: metrics
          containerPort: 8601
          protocol: TCP
        #readinessProbe:
        #    httpGet:
        #      path: /health
        #      port: http
        #    initialDelaySeconds: 3
        #    periodSeconds: 30
        #    failureThreshold: 3
        #    successThreshold: 1
        #    timeoutSeconds: 30
        #livenessProbe:
        #    httpGet:
        #      path: /health
        #      port: http
        #    initialDelaySeconds: 5
        #    periodSeconds: 30
        #    failureThreshold: 3
        #    successThreshold: 1
        #    timeoutSeconds: 5
        lifecycle:
          preStop:
            exec:
              command: ["/bin/sh","-c","sleep 5"]
      terminationGracePeriodSeconds: 60
      affinity:
        nodeAffinity:
          requiredDuringSchedulingIgnoredDuringExecution:
            nodeSelectorTerms:
              - matchExpressions:
                  - key: kubernetes.io/arch
                    operator: In
                    values:
                      - amd64
                  - key: karpenter.k8s.aws/instance-family
                    operator: In
                    values:
                      - t3
                      - t3a
                  - key: karpenter.sh/capacity-type
                    operator: In
                    values:
                      - spot
                      - on-demand
                  - key: karpenter.sh/nodepool
                    operator: In
                    values:
                      - spot-al2023
      topologySpreadConstraints:
        - maxSkew: 1
          topologyKey: kubernetes.io/hostname
          whenUnsatisfiable: DoNotSchedule
          labelSelector:
            matchLabels:
              app: *app-name
          matchLabelKeys:
          - pod-template-hash 
        - maxSkew: 1
          topologyKey: topology.kubernetes.io/zone
          whenUnsatisfiable: ScheduleAnyway
          labelSelector:
            matchLabels:
              app: *app-name
          matchLabelKeys:
          - pod-template-hash