[build-system]
requires = ["setuptools>=61.0.0"]
build-backend = "setuptools.build_meta"

[project]
name = "py-inventory-a2a-v2"
version = "0.1.0"
description = "A a2a agent in charge of inventory affairs."
dependencies = [
    "pydantic",
    "fastapi",
    "uvicorn",
    "gunicorn",
    "numpy",
    "mcp",
    "google-adk[a2a]",
    "opentelemetry-sdk",
    "opentelemetry-api",
    "opentelemetry-instrumentation-aiohttp-client",
    "opentelemetry-instrumentation-logging",
    "opentelemetry-exporter-otlp-proto-grpc",
    "aiohttp",
    "prometheus-client",
]